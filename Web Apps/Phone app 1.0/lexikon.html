<!DOCTYPE html>
<html lang="de">

<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Pixelify+Sans:wght@400..700&display=swap"
    rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Lexikon</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: "Manrope", sans-serif;
      font-weight: bold;
      background: #F3F3F3;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      width: 393px;
      height: 852px;
      color: #000;
      font-size: 24px;
      font-style: normal;
      line-height: normal;

    }

    .top-bar {
      background: #151615;
      height: 56px;
      flex-shrink: 0;
    }

    .search-container {
      padding: 14px 30px 0px;
      background: #f3f3f300;
      flex-shrink: 0;
      border-radius: 5px;
    }

    .filter-row {
      display: flex;
      gap: 8px;
      padding: 10px 30px 0;
      flex-shrink: 0;
    }

    .filter-btn {
      border: 4px solid #1c1c1c;
      background: #fff;
      color: #1c1c1c;
      font-family: "Manrope", sans-serif;
      font-size: 14px;
      font-weight: 700;
      padding: 5px 14px;
      cursor: pointer;
      border-radius: 5px;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }

    .filter-btn.active {
      background: #1c1c1c;
      color: #fff;
    }

    .search-bar {
      display: flex;
      align-items: center;
      background: #fff;
      border: 6px solid #1c1c1c;
      padding: 10px 14px;
      gap: 13px;
      border-radius: 5px;
    }

    .search-bar svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .search-input {
      border: none;
      outline: none;
      font-size: 18px;
      color: #555;
      width: 100%;
      background: transparent;
    }

    .search-input::placeholder {
      color: #888;
    }

    .word-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 30px 16px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .word-entry {
      background: #fff;
      border: 5px solid #1c1c1c;
      padding: 7px 7px;
      font-size: 18px;
      color: #1c1c1c;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      border-radius: 5px;

    }

    .word-entry:active {
      background: #f0f0f0;
    }

    .detail-view {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 10px 30px 16px;
      flex-direction: column;
      gap: 7px;
    }

    .detail-view.visible {
      display: flex;
    }

    .detail-card {
      background: #fff;
      border: 5px solid #1c1c1c;
      border-radius: 40px;
      padding: 30px 30px 36px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 160px;
      gap: 2px;
      flex-shrink: 0;
    }

    .detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 4px 0;
      flex-shrink: 0;
    }

    .detail-german {
      font-size: 18px;
      font-weight: 500;
      color: #1c1c1c;
    }

    .bookmark-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .bookmark-btn svg {
      width: 26px;
      height: 26px;
      fill: #ccc;
    }

    .bookmark-btn.marked svg {
      fill: #1c1c1c;
    }

    .detail-dialect-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .detail-dialect {
      font-size: 100%;
      font-weight: 800;
      color: #1c1c1c;
    }

    .play-btn {
      width: 44px;
      height: 44px;
      border: 3px solid #ffffff;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0;
    }

    .play-btn svg {
      width: 40px;
      height: 40px;
      fill: #1c1c1c;
    }

    .play-btn:active {
      background: #f0f0f0;
    }

    .no-results {
      text-align: center;
      color: #888;
      padding: 48px 20px;
      font-size: 16px;
    }

    .bottom-nav {
      background: #151615;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      flex-shrink: 0;
    }

    .nav-btn {
      width: 52px;
      height: 52px;
      border: 4px solid #151615;
      background: #151615;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      margin-bottom: 0px;
    }

    .nav-btn.active {
      background: #606060;
      border: 4px solid #F3F3F3;
    }

    .nav-btn svg {
      width: 35px;
      height: 35px;
      fill: #fff;
    }
  </style>
</head>

<body>

  <div class="top-bar"></div>

  <div class="search-container">
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2.5" stroke-linecap="round">
        <circle cx="11" cy="11" r="7" />
        <line x1="16.5" y1="16.5" x2="22" y2="22" />
      </svg>
      <input type="text" class="search-input" placeholder="Suchen..." id="searchInput" autocomplete="off"
        autocorrect="off" spellcheck="false">
    </div>
  </div>

  <div class="filter-row">
    <button class="filter-btn" onclick="setFilter('az', this)">A–Z</button>
    <button class="filter-btn" onclick="setFilter('kochen', this)">Kochen</button>
    <button class="filter-btn" onclick="setFilter('orte', this)">Orte</button>
    <button class="filter-btn" onclick="setFilter('tiere', this)">Tiere</button>
  </div>

  <div class="word-list" id="wordList"></div>

  <div class="detail-view" id="detailView" onclick="handleDetailBackdropClick(event)">
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn" onclick="navigateTo('index.html')" aria-label="Home">
      <svg viewBox="0 0 24 24">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
      </svg>
    </button>
    <button class="nav-btn active" aria-label="Suche">
      <svg viewBox="0 0 24 24">
        <path
          d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
      </svg>
    </button>
    <button class="nav-btn" onclick="navigateTo('marked.html')" aria-label="Gespeichert">
      <svg viewBox="0 0 24 24">
        <path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z" />
      </svg>
    </button>
    <button class="nav-btn" onclick="navigateTo('settings.html')" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24">
        <path
          d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.63-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
      </svg>
    </button>
  </nav>

  <script src="script.js"></script>
  <script>
    let allEntries = [];
    let activeFilter = null;

    const KOCHEN = new Set([
      'Abendessen','Ackerbohne','Ackersalat','anbraten','Apfelkuchen','Apfelmus',
      'Apfelsine','Apfelwein','aufgehen (Hefeteig)','Aufgehen (Hefeteig)','ausbacken',
      'ausrollen (Teig)','Bärlauch','Béchamelsauce','Bündnerfleisch','Backblech','backen',
      'Backfisch','Backform','Backmenge','Backofen','Backpulver','Backstube','Bauernbrot',
      'Beere','Beinschinken','Birne','Birne, wilde','Birnenblüte','Birnenwein',
      'Birnschnaps','Blätterteig','Blutwurst','Bohne','Bohne, weisse','Bohnenkraut',
      'Bohnenstange','Bouillon','Branntwein','braten','Braten','braten, langsam',
      'braten, leicht','Brathähnchen','Bratröhre (im Ofen)','Brei','breiig','Brombeere',
      'Brot','Brot, das Weiche vom ~','Brot, eingebrocktes','Brot, selbstgebackenes',
      'Brotanschnitt','Brotkrügelchen','Brotrinde','Brotschaufel','Brotscheibe',
      'Brotstückchen, eingetauchtes','Brotverträger','Butter','Butterbrot','Butterform',
      'Buttersauce','Buttersemmel','Butterstock','butterweich','Dampfkochtopf','Dampfnudel',
      'Dessert','Baslerwein','Aronstabschnaps'
    ]);

    const TIERE = new Set([
      'Aal','Ameise','Amsel','Auerhahn','Barri (Hundename)','Biene','Bienenhaus',
      'Bienenstock','Bienenvater','Bienenzüchter','Blindschleiche','Blässhuhn','Bock',
      'Bockkäfer (schwarzer)','Brillenschlange','Brummbär','Dalmatinerhund','Distelfink'
    ]);

    const ORTE = new Set([
      'Aeschenplatz','Aeschentor','Aeschenvorstadt','Anwil','Arboldswil','Arlesheim',
      'Bachlettenquartier','Badeanstalt Breite','Badeanstalt Sankt Johann','Badeplatz',
      'Barfüsserplatz','Bellinzona','Berlin','Bern','Bettingen','Binningen','Birsfelden',
      'Birsigtal','Blotzheim','Bonfol','Bottmingen','Breitequartier','Bruderholz','Brüglingen',
      'Bewohner der Freien Strasse','Bewohner der Gerbergasse',
      'Bewohner der Sankt Johanns-Vorstadt','Bewohner der Spalenvorstadt',
      'Bewohner der Steinenvorstadt','Bewohner des Breitequartiers',
      'Bewohner des Gundeldingerquartiers','Bewohner des Kantons Zürich',
      'Bewohner des Sankt Alban- Quartiers','Bewohner des Sankt Johann-Quartiers',
      'Bewohner von Riehen','Colmar','Delsberg','Rhein'
    ]);

    function esc(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function setFilter(filter, btn) {
      if (activeFilter === filter) {
        activeFilter = null;
        btn.classList.remove('active');
      } else {
        activeFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
      applyFilters();
    }

    function matchesFilter(entry) {
      if (activeFilter === 'az') return true;
      if (activeFilter === 'kochen') return KOCHEN.has(entry.german);
      if (activeFilter === 'orte') return ORTE.has(entry.german) || entry.german.startsWith('Bewohner');
      if (activeFilter === 'tiere') return TIERE.has(entry.german);
      return false;
    }

    function applyFilters() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!activeFilter && !q) {
        renderList([]);
        return;
      }
      let entries = activeFilter ? allEntries.filter(matchesFilter) : allEntries;
      if (q) {
        entries = entries.filter(e =>
          e.german.toLowerCase().includes(q) ||
          e.baseldeutsch.some(w => w.toLowerCase().includes(q))
        );
      }
      renderList(entries);
    }

    function renderList(entries) {
      const list = document.getElementById('wordList');
      if (entries.length === 0) {
        list.innerHTML = '<div class="no-results">Keine Ergebnisse gefunden</div>';
        return;
      }
      list.innerHTML = entries.map((entry, i) =>
        `<div class="word-entry" onclick="openDetail(${allEntries.indexOf(entry)})">${esc(entry.german)} - ${esc(entry.baseldeutsch[0])}</div>`
      ).join('');
    }

    function getMarked() {
      return JSON.parse(localStorage.getItem('markedWords') || '[]');
    }

    function isMarked(german) {
      return getMarked().some(w => w.german === german);
    }

    function toggleMark(index) {
      const entry = allEntries[index];
      let words = getMarked();
      const i = words.findIndex(w => w.german === entry.german);
      if (i >= 0) {
        words.splice(i, 1);
      } else {
        words.push({ german: entry.german, baseldeutsch: entry.baseldeutsch });
      }
      localStorage.setItem('markedWords', JSON.stringify(words));
      const btn = document.getElementById('markBtn');
      if (btn) btn.classList.toggle('marked', i < 0);
    }

    function openDetail(index) {
      const entry = allEntries[index];
      const view = document.getElementById('detailView');
      const marked = isMarked(entry.german);
      view.innerHTML = `
        <div class="detail-header">
          <div class="detail-german">${esc(entry.german)}</div>
          <button class="bookmark-btn${marked ? ' marked' : ''}" id="markBtn" onclick="toggleMark(${index}); event.stopPropagation();" aria-label="Speichern">
            <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
          </button>
        </div>` +
        entry.baseldeutsch.map(word => `
        <div class="detail-card">
          <div class="detail-dialect-row">
            <span class="detail-dialect">${esc(word)}</span>
            <button class="play-btn" onclick="speak('${word.replace(/'/g, "\\'")}'); event.stopPropagation();" aria-label="Aussprechen">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
          </div>
        </div>
      `).join('');
      document.getElementById('wordList').style.display = 'none';
      view.classList.add('visible');
    }

    function closeDetail() {
      document.getElementById('detailView').classList.remove('visible');
      document.getElementById('wordList').style.display = 'flex';
    }

    function handleDetailBackdropClick(e) {
      if (e.target === document.getElementById('detailView') || e.target.classList.contains('detail-card')) closeDetail();
    }

    function speak(word) {
      if (!window.speechSynthesis) return;
      const utt = new SpeechSynthesisUtterance(word);
      utt.lang = 'de-CH';
      speechSynthesis.cancel();
      speechSynthesis.speak(utt);
    }

    fetch('baseldeutsch.json')
      .then(r => r.json())
      .then(data => {
        allEntries = data.sort((a, b) => a.german.localeCompare(b.german, 'de'));
        applyFilters();
      })
      .catch(() => {
        document.getElementById('wordList').innerHTML =
          '<div class="no-results">Daten konnten nicht geladen werden.</div>';
      });

    document.getElementById('searchInput').addEventListener('input', function () {
      closeDetail();
      applyFilters();
    });
  </script>

</body>

</html>
