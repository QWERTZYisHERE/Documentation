<!DOCTYPE html>
<html lang="de">

<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Pixelify+Sans:wght@400..700&display=swap"
    rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Einstellungen</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: "Manrope", sans-serif;
      font-weight: bold;
      background: #F3F3F3;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      width: 393px;
      height: 852px;
      color: #1c1c1c;
      font-size: 24px;
      font-style: normal;
      line-height: normal;
    }

    .top-bar {
      background: #151615;
      height: 56px;
      flex-shrink: 0;
    }

    .page-title {
      font-size: 42px;
      font-weight: 800;
      color: #1c1c1c;
      padding: 18px 30px 14px;
      flex-shrink: 0;
    }

    .settings-card {
      margin: 0 30px;
      background: #fff;
      border: 5px solid #1c1c1c;
      border-radius: 5px;
      padding: 20px 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex-shrink: 0;
    }

    .setting-row {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .setting-label {
      font-size: 20px;
      font-weight: 700;
      color: #1c1c1c;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: #1c1c1c;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #555;
      cursor: pointer;
      margin-top: -12px;
    }

    input[type="range"]::-moz-range-thumb {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #555;
      border: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      background: #1c1c1c;
      border-radius: 2px;
    }

    input[type="range"]::-moz-range-track {
      height: 4px;
      background: #1c1c1c;
      border-radius: 2px;
    }

    .spacer {
      flex: 1;
    }

    .bottom-nav {
      background: #151615;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      flex-shrink: 0;
    }

    .nav-btn {
      width: 52px;
      height: 52px;
      border: 4px solid #151615;
      background: #151615;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      margin-bottom: 0px;
    }

    .nav-btn.active {
      background: #606060;
      border: 4px solid #F3F3F3;
    }

    .nav-btn svg {
      width: 35px;
      height: 35px;
      fill: #fff;
    }
  </style>
</head>

<body>

  <div class="top-bar"></div>

  <div class="page-title">Einstellungen</div>

  <div class="settings-card">
    <div class="setting-row">
      <label class="setting-label" for="fontSize">Schriftgrösse</label>
      <input type="range" id="fontSize" min="1" max="5" step="1" value="3">
    </div>
    <div class="setting-row">
      <label class="setting-label" for="animSpeed">Animationslänge</label>
      <input type="range" id="animSpeed" min="1" max="5" step="1" value="3">
    </div>
  </div>

  <div class="spacer"></div>

  <nav class="bottom-nav">
    <button class="nav-btn" onclick="navigateTo('index.html')" aria-label="Home">
      <svg viewBox="0 0 24 24">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
      </svg>
    </button>
    <button class="nav-btn" onclick="navigateTo('lexikon.html')" aria-label="Suche">
      <svg viewBox="0 0 24 24">
        <path
          d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
      </svg>
    </button>
    <button class="nav-btn" onclick="navigateTo('marked.html')" aria-label="Gespeichert">
      <svg viewBox="0 0 24 24">
        <path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z" />
      </svg>
    </button>
    <button class="nav-btn active" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24">
        <path
          d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.63-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
      </svg>
    </button>
  </nav>

  <script src="script.js"></script>
  <script>
    const fontSizes = ['14px', '16px', '18px', '20px', '22px'];
    const animSpeeds = ['0.08s', '0.15s', '0.22s', '0.35s', '0.5s'];

    function loadSettings() {
      const fs = parseInt(localStorage.getItem('fontSize') || '3');
      const as = parseInt(localStorage.getItem('animSpeed') || '3');
      document.getElementById('fontSize').value = fs;
      document.getElementById('animSpeed').value = as;
    }

    document.getElementById('fontSize').addEventListener('input', function () {
      localStorage.setItem('fontSize', this.value);
    });

    document.getElementById('animSpeed').addEventListener('input', function () {
      localStorage.setItem('animSpeed', this.value);
    });

    loadSettings();
  </script>

</body>

</html>
