<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Pixelify+Sans:wght@400..700&display=swap"
        rel="stylesheet">

    <title>Baseldeutsch</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: "Manrope", sans-serif;
            font-weight: bold;
            background: #F3F3F3;
            display: flex;
            flex-direction: column;
            max-width: 480px;
            margin: 0 auto;
            width: 393px;
            height: 852px;
            color: #000;
        }

        .top-bar {
            background: #151615;
            height: 56px;
            flex-shrink: 0;
        }

        .map-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            overflow: hidden;
            order: 1;
        }

        .bottom-nav {
            order: 2;
        }

        .map-area svg {
            width: 100%;
            height: auto;
            max-height: 100%;
            transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: 43% 58%;
        }

        .map-area svg.zoomed {
            transform: scale(2.5);
        }

        #marker1 {
            cursor: pointer;
        }

        #marker1.active #circle1 {
            stroke: #5CB85C;
            stroke-width: 5px;
        }

        #bubble1 {
            display: block;
            pointer-events: none;
            transform: scale(0);
            transform-origin: 144px 220px;
            transition-delay: 3s;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #bubble1.visible {
            transform: scale(1);
            transition-delay: 0.5s;
        }



        .bottom-nav {
            background: #151615;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }

        .nav-btn {
            width: 52px;
            height: 52px;
            border: 4px solid #151615;
            background: #151615;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-bottom: 0px;
        }

        .nav-btn.active {
            background: #606060;
            border: 4px solid #F3F3F3;
        }

        .nav-btn svg {
            width: 35px;
            height: 35px;
            fill: #fff;
        }
    </style>
</head>

    <script>
        let zoomed = false;

        function toggleMarker(event) {
            event.stopPropagation();
            zoomed = !zoomed;
            document.getElementById('map-svg').classList.toggle('zoomed', zoomed);
            document.getElementById('marker1').classList.toggle('active', zoomed);
            document.getElementById('bubble1').classList.toggle('visible', zoomed);
        }

        function unzoom() {
            if (!zoomed) return;
            zoomed = false;
            document.getElementById('map-svg').classList.remove('zoomed');
            document.getElementById('marker1').classList.remove('active');
            document.getElementById('bubble1').classList.remove('visible');
        }
    </script>
