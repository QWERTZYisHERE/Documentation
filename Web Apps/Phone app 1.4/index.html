    <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Baseldeutsch</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: "Manrope", sans-serif;
            font-weight: bold;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            max-width: 393px;
            margin: 0 auto;
            width: 100%;
            height: 100dvh;
            color: var(--text);
        }

        .top-bar {
            background: var(--bg);
            height: 30px;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .map-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            overflow: hidden;
            order: 1;
        }

        .bottom-nav {
            order: 2;
        }

        .map-area svg {
            width: 100%;
            height: auto;
            max-height: 100%;
            transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: 43% 58%;
        }

        .map-area svg.zoomed {
            transform: scale(2.5);
        }

        #marker1 {
            cursor: pointer;
        }

        #marker1.active #circle1 {
            stroke-width: 5px;
        }

        #bubble1 {
            display: block;
            pointer-events: none;
            transform: scale(0);
            transform-origin: 142px 243px;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #bubble1.visible {
            transform: scale(0.5) !important;
            transition-delay: 0.5s;
            transform-origin: 142px 243px;
        }



        .bottom-nav {
            background: var(--bg);
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            flex-shrink: 0;
            position: sticky;
            bottom: 0;
            border-top: 3px solid var(--border-nav);
            z-index: 100;
        }

        .nav-btn {
            width: 52px;
            height: 52px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-bottom: 5px;
        }

        .nav-btn svg {
            width: 30px;
            height: 30px;
        }

        .nav-btn svg path {
            fill: var(--accent);
            stroke: var(--accent);
        }

        .nav-btn.active svg path {
            fill: var(--accent-light);
            stroke: var(--accent-light);
        }

        /* ── Map SVG color theming ── */
        #map-svg path[fill="#413A3A"] { fill: var(--map-extrude); }
        #map-svg > path[stroke-width="5"] { stroke: var(--map-border); }
        #map-svg circle[fill="#4C4848"] { fill: var(--map-lock-bg); }
        #map-svg path[fill="#A29595"] { fill: var(--map-lock-ring); }
        #map-svg path[stroke-width="4"] { stroke: var(--map-lock-ring); }
        #map-svg path[fill="#4C4848"] { fill: var(--map-lock-hole); stroke: var(--map-lock-hole); }

        /* ── Marker ── */
        #circle1 { fill: var(--accent); }
        #marker1 path[fill="#8CD0D3"] { fill: var(--accent-light); }

        /* ── Speech bubble ── */
        #bubble1 path[fill="#44869A"] { fill: var(--accent); }
        #bubble1 path[fill="#8CD0D3"] { fill: var(--accent-light); }
    </style>
</head>

    <script>
        let zoomed = false;

        function toggleMarker(event) {
            event.stopPropagation();
            zoomed = !zoomed;
            document.getElementById('map-svg').classList.toggle('zoomed', zoomed);
            document.getElementById('marker1').classList.toggle('active', zoomed);
            document.getElementById('bubble1').classList.toggle('visible', zoomed);
        }

        function unzoom() {
            if (!zoomed) return;
            zoomed = false;
            document.getElementById('map-svg').classList.remove('zoomed');
            document.getElementById('marker1').classList.remove('active');
            document.getElementById('bubble1').classList.remove('visible');
        }
