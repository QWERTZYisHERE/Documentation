<html lang="de">

<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Pixelify+Sans:wght@400..700&display=swap"
    rel="stylesheet">
  <meta charset="UTF-8">
  <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Gespeichert</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: "Manrope", sans-serif;
      font-weight: bold;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      max-width: 393px;
      margin: 0 auto;
      width: 100%;
      height: 100dvh;
      color: var(--text);
      font-size: 24px;
      font-style: normal;
      line-height: normal;
    }

    .top-bar {
      background: var(--bg);
      height: 30px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    /* ── View system ── */
    .view {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
    }

    .view.active {
      display: flex;
    }

    /* ── List view ── */
    .uben-container {
      padding: 14px 20px 0px;
      background: transparent;
      flex-shrink: 0;
    }

    .uben-btn {
      display: flex;
      align-items: center;
      background: var(--accent);
      border: solid var(--accent-light);
      border-width: 2px 2px 5px 2px;
      padding: 12px 260px 12px 12px;
      gap: 12px;
      border-radius: 30px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .uben-btn:active {
      filter: brightness(0.85);
    }

    .uben-label {
      font-family: "Manrope", sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }

    .uben-btn>svg {
      width: 15px;
      height: 15px;
      margin-left: 5px;
      fill: var(--accent-light);
      flex-shrink: 0;
    }

    .word-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .word-entry {
      background: var(--bg-card);
      border: solid var(--border);
      border-width: 2px 2px 5px 2px;
      padding: 7px 7px 7px 14px;
      font-size: 18px;
      color: var(--text);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .word-entry span {
      flex: 1;
      min-width: 0;
    }

    .remove-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .no-results {
      text-align: center;
      color: var(--text-muted);
      padding: 48px 20px;
      font-size: 16px;
    }

    .filter-row {
      display: flex;
      gap: 8px;
      padding: 10px 20px 0;
      flex-shrink: 0;
    }

    .filter-btn {
      border-width: 2px 2px 5px 2px;
      border-style: solid;
      border-color: var(--border);
      background: transparent;
      color: var(--text);
      font-family: "Manrope", sans-serif;
      font-size: 14px;
      font-weight: 700;
      padding: 10px 25px;
      cursor: pointer;
      border-radius: 20px;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent-light);
      color: #fff;
    }

    /* ── Exercise view ── */
    .card-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .exercise-card,
    .card-shadow {
      position: absolute;
      width: 282px;
      height: 282px;
      background: var(--bg-card);
      border: solid var(--border);
      border-width: 2px 2px 5px 2px;
      border-radius: 40px;
    }

    .card-shadow-2 {
      transform: translateY(-14px) scale(0.91);
      z-index: 1;
    }

    .card-shadow-1 {
      transform: translateY(-7px) scale(0.96);
      z-index: 2;
    }

    .exercise-card {
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-word {
      font-size: 38px;
      font-weight: 800;
      color: var(--text);
      text-align: center;
      padding: 0 24px;
    }

    .spoken-feedback {
      height: 22px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      text-align: center;
      padding: 0 30px;
      flex-shrink: 0;
    }

    .progress-text {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-dim);
      text-align: center;
      padding: 0 30px 10px;
      flex-shrink: 0;
    }

    .action-buttons {
      display: flex;
      justify-content: space-around;
      padding: 0 30px 60px;
      flex-shrink: 0;
    }

    .mic-btn,
    .wrong-btn {
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .mic-btn svg,
    .wrong-btn svg {
      width: 112px;
      height: auto;
    }

    @keyframes pulse {

      0%,
      100% {
        filter: drop-shadow(0 0 0px rgba(69, 173, 79, 0.5));
      }

      50% {
        filter: drop-shadow(0 0 10px rgba(69, 173, 79, 0.8));
      }
    }

    .mic-btn.listening svg {
      animation: pulse 1s infinite;
    }

    .mic-btn:disabled {
      opacity: 0.4;
    }

    /* ── Results view ── */
    .results-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 40px;
    }

    .results-title {
      font-size: 50px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 28px;
      line-height: 1.1;
    }

    .results-score {
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
    }

    .result-correct {
      color: var(--result-correct);
    }

    .result-wrong {
      color: var(--result-wrong);
    }

    .results-back {
      background: none;
      border: none;
      font-size: 50px;
      font-weight: 400;
      color: var(--text);
      margin-top: 32px;
      cursor: pointer;
      text-align: left;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Bottom nav ── */
    .bottom-nav {
      background: var(--bg);
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      flex-shrink: 0;
      position: sticky;
      bottom: 0;
      border-top: 3px solid var(--border-nav);
      z-index: 100;
    }

    .nav-btn {
      width: 52px;
      height: 52px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      margin-bottom: 5px;
    }

    .nav-btn svg {
      width: 30px;
      height: 30px;
    }

    .nav-btn svg path {
      fill: var(--accent);
      stroke: var(--accent);
    }

    .nav-btn.active svg path {
      fill: var(--accent-light);
      stroke: var(--accent-light);
    }
  </style>
</head>

  <script src="script.js"></script>
  <script>
    // ── State ──
    let exerciseWords = [];
    let currentIndex = 0;
    let correctCount = 0;
    let wrongCount = 0;
    let isListening = false;
    let animating = false;
    let recognition = null;

    // ── Speech Recognition setup ──
    const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognitionAPI) {
      recognition = new SpeechRecognitionAPI();
      recognition.lang = 'de-CH';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onresult = function (e) {
        const spoken = e.results[0][0].transcript.trim();
        setListening(false);
        document.getElementById('spokenFeedback').textContent = '„' + spoken + '"';
        setTimeout(function () {
          document.getElementById('spokenFeedback').textContent = '';
          checkAnswer(spoken);
        }, 700);
      };

      recognition.onerror = function () { setListening(false); };
      recognition.onend = function () { setListening(false); };
    } else {
      document.getElementById('micBtn').disabled = true;
    }

    function setListening(val) {
      isListening = val;
      document.getElementById('micBtn').classList.toggle('listening', val);
    }

    function startVoice() {
      if (!recognition || animating) return;
      if (isListening) { recognition.stop(); return; }
      setListening(true);
      try { recognition.start(); } catch (e) { setListening(false); }
    }

    // ── Answer matching ──
    function normalize(str) {
      return str.toLowerCase()
        .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue')
        .replace(/[^a-z]/g, '');
    }

    function levenshtein(a, b) {
      const m = a.length, n = b.length;
      if (!m) return n;
      if (!n) return m;
      const dp = Array.from({ length: m + 1 }, (_, i) => [i]);
      for (let j = 0; j <= n; j++) dp[0][j] = j;
      for (let i = 1; i <= m; i++)
        for (let j = 1; j <= n; j++)
          dp[i][j] = a[i - 1] === b[j - 1]
            ? dp[i - 1][j - 1]
            : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
      return dp[m][n];
    }

    function checkAnswer(spoken) {
      const entry = exerciseWords[currentIndex];
      const ns = normalize(spoken);
      const correct = entry.baseldeutsch.some(function (w) {
        const nw = normalize(w);
        if (ns === nw) return true;
        if (ns.includes(nw) || nw.includes(ns)) return true;
        if (Math.abs(ns.length - nw.length) <= 3 && levenshtein(ns, nw) <= 2) return true;
        return false;
      });
      if (correct) handleCorrect();
      else handleWrong();
    }

    // ── Card flow ──
    function animateCard(direction) {
      if (animating) return;
      animating = true;
      if (isListening) recognition.stop();
      const card = document.getElementById('exerciseCard');
      card.style.transition = 'transform 0.36s ease-in, opacity 0.36s ease-in';
      card.style.transform = direction === 'right'
        ? 'translateX(160%) rotate(12deg)'
        : 'translateX(-160%) rotate(-12deg)';
      card.style.opacity = '0';
      setTimeout(function () {
        currentIndex++;
        if (currentIndex >= exerciseWords.length) {
          showResults();
        } else {
          card.style.transition = 'none';
          card.style.transform = '';
          card.style.opacity = '1';
          void card.offsetWidth;
          animating = false;
          showCard();
        }
      }, 380);
    }

    function handleCorrect() { correctCount++; animateCard('left'); }
    function handleWrong() { wrongCount++; animateCard('right'); }

    function showCard() {
      const entry = exerciseWords[currentIndex];
      document.getElementById('cardWord').textContent = entry.german;
      document.getElementById('progressText').textContent =
        (currentIndex + 1) + ' / ' + exerciseWords.length;
      document.getElementById('spokenFeedback').textContent = '';
      const rem = exerciseWords.length - currentIndex;
      document.getElementById('cardShadow1').style.visibility = rem > 1 ? 'visible' : 'hidden';
      document.getElementById('cardShadow2').style.visibility = rem > 2 ? 'visible' : 'hidden';
    }

    function startUeben() {
      const words = getMarked();
      if (!words.length) return;
      exerciseWords = words.slice().sort(function () { return Math.random() - 0.5; });
      currentIndex = 0;
      correctCount = 0;
      wrongCount = 0;
      animating = false;
      const card = document.getElementById('exerciseCard');
      card.style.transition = 'none';
      card.style.transform = '';
      card.style.opacity = '1';
      showView('exercise');
      showCard();
    }

    function showResults() {
      animating = false;
      const total = correctCount + wrongCount;
      const pct = total > 0 ? correctCount / total : 0;
      const title = pct >= 0.8 ? 'Gut gemacht!' : pct >= 0.4 ? 'Nicht schlecht' : 'Es geht besser';
      document.getElementById('resultsTitle').textContent = title;
      document.getElementById('resultCorrect').textContent = correctCount;
      document.getElementById('resultWrong').textContent = wrongCount;
      showView('results');
    }

    function backToList() {
      showView('list');
      render();
    }

    function showView(name) {
      ['list', 'exercise', 'results'].forEach(function (v) {
        document.getElementById(v + 'View').classList.toggle('active', v === name);
      });
    }

    // ── List / storage ──
    function esc(text) {
      return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function getMarked() {
      return JSON.parse(localStorage.getItem('markedWords') || '[]');
    }

    function removeMarked(german) {
      const words = getMarked().filter(function (w) { return w.german !== german; });
      localStorage.setItem('markedWords', JSON.stringify(words));
      render();
    }

    let displayMode = 'mundart';

    function setDisplay(mode, btn) {
      displayMode = mode;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function render() {
      const words = getMarked();
      const list = document.getElementById('wordList');
      if (!words.length) {
        list.innerHTML = '<div class="no-results">Keine gespeicherten Wörter</div>';
        return;
      }
      list.innerHTML = words.map(function (w) {
        const label = displayMode === 'mundart' ? esc(w.baseldeutsch[0]) : esc(w.german);
        return '<div class="word-entry">'
          + '<span>' + label + '</span>'
          + '<button class="remove-btn" onclick="removeMarked(\'' + w.german.replace(/'/g, "\\'") + '\')" aria-label="Entfernen">'
          + '<svg viewBox="0 0 22 6" fill="none"><rect x="0" y="0" width="17" height="4" rx="1" fill="#C0392B"/></svg>'
          + '</button></div>';
      }).join('');
    }

    render();
  </script>

</body>

</html>
